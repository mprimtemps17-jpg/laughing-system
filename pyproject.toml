[project]
name = "frictionlab"
version = "0.1.0"
description = "LLMを用いて二者間会話の摩擦（ずれ・配慮不足）を判定し、条件を一つずつ変えて要因を探る実験環境"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=2.3",
    "pydantic>=2",
    "pyyaml>=6",
    "pandas>=2",
    "scipy>=1.11",
    "scikit-learn>=1.3",
    "matplotlib>=3.8",
    "tabulate>=0.9",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
frictionlab = "frictionlab.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
